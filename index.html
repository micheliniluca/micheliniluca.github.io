<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le mie GitHub Pages</title>
<meta name="description" content="Elenco automatico di tutti i siti GitHub Pages pubblicati da questo account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: intestazione con ricerca, poi griglia di schede (una colonna su telefono) */
:root{
  --bg:#e6eaee; --surface:#f6f8fa; --ink:#14202b; --muted:#5b6977; --line:#c9d1d9;
  --accent:#2d6db3; --accent-soft:#d6e3f2; --ok:#2f8a47;
  --f-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1a2027; --ink:#e8eef3; --muted:#8b99a6; --line:#2a333c;
  --accent:#5b9be0; --accent-soft:#1f2d3c; --ok:#4fb26a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1a2027; --ink:#e8eef3; --muted:#8b99a6; --line:#2a333c;
  --accent:#5b9be0; --accent-soft:#1f2d3c; --ok:#4fb26a; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg); color:var(--ink)}
body{margin:0; font-family:var(--f-ui); font-size:16px; line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(24px,env(safe-area-inset-top,0px)) 48px}
.wrap{max-width:1040px; margin:0 auto}
header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px 24px; margin-bottom:18px}
h1{margin:0; font-size:30px; font-weight:700; letter-spacing:.005em; text-wrap:balance}
.who{font-family:var(--f-mono); font-size:13px; color:var(--muted); margin-top:2px}
.tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
input,select,button{font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#q{width:min(260px,100%)}
button{cursor:pointer}
.status{font-size:14px; color:var(--muted); margin:0 0 14px; min-height:20px}
.status.err{color:#c84545}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px 12px; display:flex; flex-direction:column; gap:6px; min-width:0}
.card:hover{border-color:var(--accent)}
.card h2{margin:0; font-size:20px; font-weight:600; line-height:1.2; overflow-wrap:anywhere}
.card h2 a{color:var(--ink); text-decoration:none}
.card h2 a:hover{color:var(--accent)}
.card p{margin:0; color:var(--muted); font-size:15px; overflow-wrap:anywhere}
.url{font-family:var(--f-mono); font-size:12.5px; color:var(--accent); overflow-wrap:anywhere; text-decoration:none}
.meta{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin-top:auto; padding-top:6px; font-size:13px; color:var(--muted); font-family:var(--f-mono)}
.meta a{color:var(--muted)}
.chip{font-family:var(--f-ui); font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:1px 7px; border-radius:5px; background:var(--accent-soft); color:var(--accent)}
.thumb{position:relative; aspect-ratio:16/10; margin:-14px -16px 4px; border-radius:11px 11px 0 0; overflow:hidden; background:var(--bg); border-bottom:1px solid var(--line)}
.thumb .ph{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--f-mono); font-size:13px; color:var(--muted)}
.thumb iframe{position:absolute; top:0; left:0; width:1280px; height:800px; border:0; transform-origin:0 0; pointer-events:none; background:#fff; opacity:0; transition:opacity .25s}
.thumb iframe.ready{opacity:1}
.thumb a{position:absolute; inset:0; z-index:1}
.thumb a:focus-visible{outline-offset:-3px}
body.noprev .thumb{display:none}
@media (prefers-reduced-motion: reduce){ .thumb iframe{transition:none} }
.empty{padding:28px 16px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:12px}
.ask{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
footer{margin-top:28px; font-size:13px; color:var(--muted)}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Le mie GitHub Pages</h1>
      <div class="who" id="who"></div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Cerca per nome o descrizione" aria-label="Cerca">
      <select id="sort" aria-label="Ordina">
        <option value="updated">Aggiornate di recente</option>
        <option value="name">Nome A–Z</option>
        <option value="created">Create di recente</option>
      </select>
      <button id="prev" aria-pressed="true" title="Mostra o nascondi le anteprime dei siti">Anteprime: sì</button>
      <button id="reload" title="Rileggi l'elenco da GitHub">Aggiorna</button>
    </div>
  </header>

  <form class="ask" id="ask" hidden>
    <input id="user" placeholder="Nome utente GitHub" aria-label="Nome utente GitHub" autocomplete="off">
    <button type="submit">Mostra</button>
  </form>

  <p class="status" id="status" aria-live="polite">Caricamento…</p>
  <div class="grid" id="grid"></div>

  <footer>Elenco generato dai repository pubblici con GitHub Pages attivo. I repository privati non compaiono.</footer>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const host = location.hostname.toLowerCase();
  let user = params.get('u') || (host.endsWith('.github.io') ? host.replace(/\.github\.io$/, '') : '');
  let repos = [];

  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(_) { return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_) {} }
  };
  const fmtDate = d => new Date(d).toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function pageUrl(r) {
    const userSite = r.name.toLowerCase() === (r.owner.login + '.github.io').toLowerCase();
    const def = 'https://' + r.owner.login.toLowerCase() + '.github.io/' + (userSite ? '' : r.name + '/');
    // se il repository ha un sito personalizzato indicato in "Website", usa quello
    if (r.homepage && /^https?:\/\//.test(r.homepage) && !/github\.com/.test(r.homepage)) return r.homepage;
    return def;
  }

  async function load(force) {
    if (!user) { $('#ask').hidden = false; $('#status').textContent = 'Scrivi il nome utente GitHub da elencare.'; $('#grid').innerHTML = ''; return; }
    $('#who').textContent = user + '.github.io';
    const key = 'pages-index:' + user.toLowerCase();
    const cached = store.get(key);
    if (cached && !force && Date.now() - cached.t < 10 * 60 * 1000) { repos = cached.repos; render(); return; }
    $('#status').className = 'status'; $('#status').textContent = 'Lettura dei repository da GitHub…';
    try {
      let all = [], page = 1;
      while (page <= 10) {
        const res = await fetch(`https://api.github.com/users/${encodeURIComponent(user)}/repos?per_page=100&page=${page}&type=owner`, { headers: { Accept: 'application/vnd.github+json' } });
        if (res.status === 404) throw new Error(`L'utente "${user}" non esiste su GitHub.`);
        if (res.status === 403 || res.status === 429) throw new Error('GitHub ha limitato le richieste (60 all\'ora senza accesso). Riprova tra qualche minuto.');
        if (!res.ok) throw new Error('GitHub ha risposto con errore ' + res.status + '.');
        const batch = await res.json();
        all = all.concat(batch);
        if (batch.length < 100) break;
        page++;
      }
      repos = all.filter(r => r.has_pages).map(r => ({
        name: r.name, desc: r.description, url: pageUrl(r), repo: r.html_url,
        updated: r.pushed_at || r.updated_at, created: r.created_at, lang: r.language, archived: r.archived
      }));
      store.set(key, { t: Date.now(), repos });
      render();
    } catch (e) {
      if (cached) { repos = cached.repos; render(); $('#status').textContent += ' · Copia salvata: ' + e.message; }
      else { $('#status').className = 'status err'; $('#status').textContent = e.message; $('#grid').innerHTML = ''; }
    }
  }

  function render() {
    const q = $('#q').value.trim().toLowerCase();
    const sort = $('#sort').value;
    let list = repos.filter(r => !q || (r.name + ' ' + (r.desc || '')).toLowerCase().includes(q));
    list.sort(sort === 'name' ? (a,b) => a.name.localeCompare(b.name, 'it', { sensitivity:'base' })
      : sort === 'created' ? (a,b) => b.created.localeCompare(a.created)
      : (a,b) => b.updated.localeCompare(a.updated));
    $('#status').className = 'status';
    $('#status').textContent = repos.length
      ? (q ? `${list.length} di ${repos.length} siti` : `${repos.length} ${repos.length === 1 ? 'sito pubblicato' : 'siti pubblicati'}`)
      : 'Nessun repository pubblico con GitHub Pages attivo.';
    $('#grid').innerHTML = list.length ? list.map(r => `
      <article class="card">
        <div class="thumb" data-src="${esc(r.url)}"><span class="ph">anteprima…</span><a href="${esc(r.url)}" aria-label="Apri ${esc(r.name)}" tabindex="-1"></a></div>
        <h2><a href="${esc(r.url)}">${esc(r.name)}</a></h2>
        <a class="url" href="${esc(r.url)}">${esc(r.url.replace(/^https?:\/\//, ''))}</a>
        ${r.desc ? `<p>${esc(r.desc)}</p>` : ''}
        <div class="meta">
          ${r.archived ? '<span class="chip">Archiviato</span>' : ''}
          <span>agg. ${fmtDate(r.updated)}</span>
          ${r.lang ? `<span>${esc(r.lang)}</span>` : ''}
          <a href="${esc(r.repo)}">repository</a>
        </div>
      </article>`).join('')
      : (repos.length ? '<div class="empty">Nessun sito corrisponde alla ricerca.</div>' : '');
    document.querySelectorAll('.thumb').forEach(t => { resizeObs.observe(t); if (previews) io.observe(t); });
  }

  // ---- anteprime: il sito vero, rimpicciolito, caricato solo quando la scheda è visibile ----
  let previews = store.get('pages-index:prev') !== false;
  const W = 1280;
  const fit = t => { const f = t.querySelector('iframe'); if (f) f.style.transform = `scale(${t.clientWidth / W})`; };
  const resizeObs = new ResizeObserver(es => es.forEach(e => fit(e.target)));
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const t = e.target; io.unobserve(t);
    if (t.querySelector('iframe')) return;
    const f = document.createElement('iframe');
    f.src = t.dataset.src;
    f.title = 'Anteprima di ' + t.dataset.src;
    f.setAttribute('sandbox', 'allow-scripts');      // niente navigazione, popup o accesso ai dati di questa pagina
    f.setAttribute('scrolling', 'no');
    f.tabIndex = -1;
    f.addEventListener('load', () => { f.classList.add('ready'); const ph = t.querySelector('.ph'); if (ph) ph.remove(); });
    setTimeout(() => { const ph = t.querySelector('.ph'); if (ph && !f.classList.contains('ready')) ph.textContent = 'anteprima non disponibile'; }, 15000);
    t.insertBefore(f, t.querySelector('a'));
    fit(t);
  }), { rootMargin: '300px' });
  function setPreviews(on) {
    previews = on; store.set('pages-index:prev', on);
    document.body.classList.toggle('noprev', !on);
    $('#prev').textContent = 'Anteprime: ' + (on ? 'sì' : 'no');
    $('#prev').setAttribute('aria-pressed', on);
    if (on) document.querySelectorAll('.thumb').forEach(t => { if (!t.querySelector('iframe')) io.observe(t); });
  }

  $('#q').addEventListener('input', render);
  $('#sort').addEventListener('change', () => { render(); store.set('pages-index:sort', $('#sort').value); });
  $('#reload').addEventListener('click', () => load(true));
  $('#prev').addEventListener('click', () => setPreviews(!previews));
  setPreviews(previews);
  $('#ask').addEventListener('submit', e => { e.preventDefault(); user = $('#user').value.trim(); if (user) { $('#ask').hidden = true; load(true); } });
  const s = store.get('pages-index:sort'); if (s) $('#sort').value = s;
  load(false);
})();
</script>
</body>
</html>
